<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar | CRUD CPF</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>Cadastro de Pessoas - CRUD</h1>
        <p>Express + JSON Server | Busca por CPF</p>
    </header>
    <nav>
        <a href="/">Início</a>
        <a href="/get/">Listar (GET)</a>
        <a href="/post/" class="ativo">Cadastrar (POST)</a>
        <a href="/put/">Atualizar (PUT)</a>
        <a href="/delete/">Excluir (DELETE)</a>
    </nav>
    <main>
        <section class="cartao">
            <h2><span class="metodo post">POST</span> Cadastrar pessoa</h2>
            <p>Preencha os dados e clique em Cadastrar.</p>
            <form id="form-cadastro">
            <div class="grade">
                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00">
                </div>
                <div class="campo">
                    <label for="rg">RG</label>
                    <input type="text" id="rg" placeholder="00.000.000-0">
                </div>
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome">
                </div>
                <div class="campo">
                    <label for="sobrenome">Sobrenome</label>
                    <input type="text" id="sobrenome">
                </div>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="nome@email.com">
                </div>
                <div class="campo">
                    <label for="idade">Idade</label>
                    <input type="number" id="idade" min="0">
                </div>
                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" placeholder="(11) 90000-0000">
                </div>
                <div class="campo">
                    <label for="rua">Rua</label>
                    <input type="text" id="rua" placeholder="Rua, número">
                </div>
                <div class="campo">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro">
                </div>
                <div class="campo">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade">
                </div>
                <div class="campo">
                    <label for="estado">Estado</label>
                    <input type="text" id="estado" placeholder="SP" maxlength="2">
                </div>
            </div>
            <div class="acoes">
                <button type="submit" class="btn-verde">Cadastrar</button>
                <button type="reset" class="btn-cinza">Limpar</button>
                <a href="/get/" class="botao">Ver lista</a>
            </div>
            </form>
            <div id="mensagem" class="mensagem"></div>
        </section>
    </main>
    <footer>Programação para Internet - CRUD com JSON Server hospedado no Render</footer>
    <script src="post.js"></script>
</body>
</html>
